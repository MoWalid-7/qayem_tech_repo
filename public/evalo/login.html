<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Evalo</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/styles.css" rel="stylesheet">
</head>

<body class="auth-wrapper">
    <!-- Navbar -->
    <nav class="qt-navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="index.html">Evalo</a>
            <a href="subscription.html" class="nav-link">Subscribe</a>
        </div>
    </nav>

    <div class="auth-card animate-up">
        <h2>Welcome Back</h2>
        <p class="subtitle">Please login to access your dashboard</p>

        <form id="loginForm">
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                <label for="email">Email Address</label>
            </div>
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
                <label for="password">Password</label>
            </div>

            <div class="mb-3">
                <label class="form-label text-secondary small">Demo: Choose Role</label>
                <select class="form-select" id="roleSelect"
                    style="background-color: var(--dark-surface); color: white; border: 1px solid var(--glass-border);">
                    <option value="employee">Employee</option>
                    <option value="manager">Department Manager</option>
                    <option value="hr">HR Specialist</option>
                    <option value="gm">General Manager</option>
                </select>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="verifyCheckbox">
                <label class="form-check-label text-secondary small" for="verifyCheckbox">
                    I have verified my email address
                </label>
            </div>

            <button type="submit" class="btn-auth">Login to Dashboard</button>

            <div class="text-center mt-4">
                <p class="text-secondary small">Don't have an account? <a href="subscription.html"
                        class="text-primary-light text-decoration-none">Subscribe</a></p>
            </div>
        </form>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
