<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - QayemTech</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/styles.css" rel="stylesheet">
</head>

<body class="bg-dark">
    <!-- Navbar -->
    <nav class="qt-navbar">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="#">QayemTech</a>
            <div class="d-flex align-items-center gap-3">
                <span id="userName" class="text-secondary small d-none d-sm-inline">User Name</span>
                <button onclick="Auth.logout()" class="btn btn-sm btn-outline-danger">Logout</button>
            </div>
        </div>
    </nav>

    <div class="dash-layout">
        <!-- Sidebar -->
        <aside class="qt-sidebar" id="sidebar">
            <div class="sidebar-header">
                <span id="roleBadge" class="role-badge">Role</span>
            </div>
            <nav class="nav flex-column" id="sidebarNav">
                <!-- Links dynamically inserted by app.js -->
            </nav>
            <div class="sidebar-divider"></div>
            <button onclick="Auth.logout()" class="btn-logout">
                <span>🚪</span> Logout
            </button>
        </aside>

        <!-- Main Content -->
        <main class="dash-main" id="mainContent">
            <!-- Content dynamically inserted by app.js -->
            <div class="d-flex justify-content-center align-items-center h-100">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </main>
    </div>

    <!-- App JS -->
    <script src="js/app.js"></script>
</body>

</html>
